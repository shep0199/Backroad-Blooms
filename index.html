<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backroad Blooms Boutique</title>
  <!-- Fonts used in the flower shop design -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- STEP 1: Shop header and navigation -->
  <header class="site-header">
    <div class="brand">
      <img src="images/logo.png" alt="Backroad Blooms logo" class="logo">
      <div>
        <h1>Backroad Blooms</h1>
        <p class="social-names">Instagram · Facebook · TikTok</p>
      </div>
    </div>
    <p class="cart-label">Cart (2)</p>
    <nav aria-label="Main navigation">
      <a href="#fall">Fall Favourites</a>
      <a href="#bouquets">Fresh Bouquets</a>
      <a href="#weddings">Weddings &amp; Events</a>
      <a href="#gifts">Plants &amp; Gifts</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>
    <!-- Search field -->
    <div class="search-area">
      <label for="search">Search the shop</label>
      <input type="search" id="search" placeholder="Search flowers and gifts">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Backroad Blooms Boutique</p>
  </footer>
</body>
</html>
